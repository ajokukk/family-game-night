<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1E9B4C"><style>*{box-sizing:border-box}html,body{margin:0}</style>
<title>Family Game Night</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Lilita+One&display=swap">
<style>
/* Layout: one phone column. Round exit badge, room-code pill, coin score pills, then the stage.
   Cream menu screens, felt-green table while a game runs. Chunky raised buttons, cream cards with colored tabs. */
:root{
  --cream:#FFF4DE; --paper:#FFFDF6; --edge:#EBD7AE; --brown:#5B3317; --brown2:#8E6C4A;
  --felt:#1E9B4C; --felt2:#16803D; --felt3:#0E5A29;
  --gold:#FFC22E; --gold2:#D98A00; --blue:#3E8DFF; --blue2:#1B58C9; --green:#27C55E; --green2:#0E8F40;
  --orange:#FF8A1F; --orange2:#C95D00; --pink:#FF5C7E; --pink2:#C42F55; --purple:#9B4DF2; --purple2:#6A25BA;
  --red:#F0453B; --red2:#B0221A; --teal:#17BFA5; --teal2:#0B8A77;
  --fg:var(--brown); --fg2:var(--brown2); --pill:rgba(91,51,23,.9);
  --f-display:'Lilita One','Fredoka',system-ui,sans-serif;
  --f-body:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  background-color:var(--cream);
  background-image:radial-gradient(rgba(91,51,23,.09) 1.6px,transparent 1.8px);background-size:22px 22px;
  color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.35;
  padding-inline:16px;padding-block:14px 56px;min-height:100%;
}
body.felt{
  --fg:#fff; --fg2:#D3F6DD; --pill:rgba(6,60,26,.55);
  background-color:var(--felt);
  background-image:radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.16),transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 24px,transparent 24px 48px);
  background-size:auto;
}
#app{max-width:30rem;margin-inline:auto;display:grid;gap:16px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
h1,h2,h3,p,ul,ol{margin:0}
h2{font:400 1.75rem/1.05 var(--f-display);letter-spacing:.01em;text-wrap:balance}
body.felt h2{text-shadow:0 2px 0 rgba(0,0,0,.22)}
.card h2,.sticky h2{text-shadow:none}
small{font-size:.8rem;color:var(--fg2)}
.note{color:var(--fg2);font-size:1rem;font-weight:500}
.meta{font:400 .95rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--fg2)}
.err{color:var(--red2);font-weight:600;background:var(--paper);border-radius:14px;padding:.6rem .9rem}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font:400 1.45rem/1 var(--f-display);letter-spacing:.01em}
body.felt .brand{text-shadow:0 2px 0 rgba(0,0,0,.25)}
.badge{width:46px;height:46px;flex:none;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;cursor:pointer;
  background:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--red);box-shadow:0 4px 0 var(--red2),0 6px 10px rgba(0,0,0,.2);color:#fff;font:400 1.3rem/1 var(--f-display)}
.badge:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red2)}
.code{display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--pill);color:#fff;padding:.35rem .9rem .35rem .4rem;cursor:pointer;font:600 1.05rem var(--f-body);letter-spacing:.2em}
.code i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE57A,var(--gold) 55%,var(--gold2));display:grid;place-items:center;font:400 .75rem var(--f-display);letter-spacing:0;color:#7A4A00;font-style:normal}

/* buttons */
.btn{--c:var(--green);--e:var(--green2);display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:400 1.2rem/1 var(--f-display);letter-spacing:.03em;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);
  min-height:54px;padding:.8rem 1.3rem;border:3px solid #fff;border-radius:18px;cursor:pointer;
  background:linear-gradient(rgba(255,255,255,.26),rgba(255,255,255,0) 55%),var(--c);
  box-shadow:0 5px 0 var(--e),0 8px 14px rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--e),0 3px 6px rgba(0,0,0,.2)}
.btn.blue{--c:var(--blue);--e:var(--blue2)}
.btn.gold{--c:var(--gold);--e:var(--gold2);color:#5B3317;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.orange{--c:var(--orange);--e:var(--orange2)}
.btn.red{--c:var(--red);--e:var(--red2)}
.btn.pink{--c:var(--pink);--e:var(--pink2)}
.btn.sm{min-height:42px;padding:.5rem 1rem;font-size:1rem;border-radius:14px}
.btn.wide{width:100%}
.btn:disabled{filter:grayscale(.8);opacity:.55;cursor:default}
.hostbar{display:flex;flex-wrap:wrap;gap:12px}
.hostbar .btn{flex:1 1 9rem}
.row2{display:flex;gap:10px;align-items:stretch}
.row2 .btn{flex:none}

/* inputs */
input{min-height:54px;width:100%;min-width:0;border:3px solid var(--edge);border-radius:16px;background:var(--paper);color:var(--brown);padding:.5rem 1rem;font-weight:500;font-size:1.1rem}
input::placeholder{color:#B59B7C}
input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 4px rgba(62,141,255,.3)}
.field{display:grid;gap:6px}
.field label{font:400 .95rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--fg2)}

/* cards */
.card{position:relative;background:var(--paper);color:var(--brown);border-radius:22px;padding:18px 16px 16px;display:grid;gap:12px;
  border:3px solid #F3E6C8;box-shadow:0 5px 0 rgba(0,0,0,.16),0 10px 18px rgba(0,0,0,.12)}
.card.tabbed{margin-top:16px;padding-top:26px}
.card .note,.card small{color:var(--brown2)}
.tab{position:absolute;top:-16px;left:14px;--c:var(--gold);background:var(--c);color:#4A2A0C;font:400 1rem/1 var(--f-display);letter-spacing:.04em;padding:.42rem .9rem .38rem;border-radius:12px 12px 0 0;box-shadow:0 -2px 0 rgba(0,0,0,.08) inset;border:2px solid rgba(0,0,0,.06);border-bottom:0}
.tab.pink{--c:var(--pink);color:#fff}.tab.green{--c:var(--teal);color:#fff}.tab.blue{--c:var(--blue);color:#fff}.tab.orange{--c:var(--orange);color:#fff}
.ok{background:#E3F8E9;color:#0A6B30;border:3px solid #BDEBCB;border-radius:16px;padding:.7rem .95rem;font-weight:600}
.reveal{display:grid;gap:2px;background:#FFF0BF;border:3px solid #FFDC73;border-radius:16px;padding:.7rem .95rem;color:var(--brown)}
.reveal small{color:var(--brown2);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.reveal strong{font:400 1.6rem/1.1 var(--f-display)}

/* score pills */
.pl{display:flex;flex-wrap:wrap;gap:8px}
.pp{display:flex;align-items:center;gap:7px;background:var(--pill);color:#fff;border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:.95rem;min-width:0;border:3px solid transparent}
.pp.turn{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,194,46,.35)}
.pp .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:6.5rem}
.pp small{color:var(--gold);text-transform:uppercase;font-size:.62rem;letter-spacing:.08em}
.pp .pt{display:inline-flex;align-items:center;gap:4px;font:400 1.05rem var(--f-display)}
.coin{width:18px;height:18px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#FFE57A,var(--gold) 55%,var(--gold2));box-shadow:0 0 0 2px rgba(122,74,0,.35) inset}
.av{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font:400 1rem var(--f-display);color:#4A2A0C;border:2px solid #fff}
.who{display:inline-flex;align-items:center;gap:8px;min-width:0;font-weight:600}

/* home logo */
.logo{display:grid;justify-items:center;gap:0;padding-top:6px}
.logo .crown{width:92px;height:auto;margin-bottom:-6px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.plaque{font:400 3.1rem/1 var(--f-display);color:#fff;text-shadow:0 3px 0 #1B58C9;padding:.2rem 1.6rem .3rem;border-radius:16px;border:4px solid #fff;
  background:linear-gradient(rgba(255,255,255,.2),transparent 50%),repeating-linear-gradient(45deg,#3E8DFF 0 14px,#3784F5 14px 28px);box-shadow:0 6px 0 var(--blue2),0 10px 16px rgba(0,0,0,.18)}
.ribbon{margin-top:-4px;background:var(--paper);color:var(--pink);font:400 1.3rem/1 var(--f-display);letter-spacing:.14em;padding:.35rem 1.2rem;border-radius:12px;border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.14);position:relative}
.letters{display:flex;gap:4px;margin-top:10px}
.letters i{font:400 1.7rem/1 var(--f-display);font-style:normal;color:var(--brown);background:var(--paper);width:2.5rem;height:3rem;display:grid;place-items:center;border-radius:8px;box-shadow:0 4px 0 var(--edge),0 6px 8px rgba(0,0,0,.14)}
.letters i:nth-child(1){transform:rotate(-9deg) translateY(6px)}.letters i:nth-child(2){transform:rotate(-4deg) translateY(1px)}
.letters i:nth-child(4){transform:rotate(4deg) translateY(1px)}.letters i:nth-child(5){transform:rotate(9deg) translateY(6px)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.steps li{display:flex;gap:10px;align-items:center;font-weight:500;color:var(--brown2)}
.steps b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#4A2A0C;display:grid;place-items:center;font:400 1rem var(--f-display)}
.lead{font-size:1.1rem;font-weight:500;color:var(--brown2);text-align:center;text-wrap:balance}

/* game picker */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px;padding-top:12px}
.gt{min-width:0;position:relative;border:3px solid #F3E6C8;border-radius:20px;background:var(--paper);padding:26px 10px 12px;text-align:center;display:grid;gap:4px;align-content:start;color:var(--brown);cursor:pointer;
  box-shadow:0 5px 0 var(--edge),0 9px 14px rgba(0,0,0,.14);transition:transform .08s,box-shadow .08s}
.gt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.gt:disabled{cursor:default}
.gt .tab{left:50%;transform:translateX(-50%);white-space:nowrap}
.gt strong{font:400 1.15rem/1.1 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.gt span{font-size:.85rem;font-weight:500;color:var(--brown2)}
.mini{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;min-height:3.6rem;margin-bottom:4px}
.mini b{font:400 .85rem var(--f-display);background:#FFF0BF;border-radius:8px;padding:.25rem .5rem;color:var(--brown)}
.mini .stk{display:grid;justify-items:center;font:400 1.15rem/1 var(--f-display)}
.mini .nt{background:#FFE76A;transform:rotate(-4deg);padding:.4rem .7rem;border-radius:4px;font:400 .95rem var(--f-display);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.mini .big{font:400 2.8rem/1 var(--f-display);color:var(--orange)}
.mini svg{width:3.3rem;height:2.2rem;border-radius:6px;box-shadow:0 0 0 2px var(--edge)}
.mini .q{background:#E8E1D6;color:var(--brown2)}

/* rebus */
.rb{min-height:11rem;place-content:center;justify-items:center;text-align:center}
.rb b{font:400 clamp(2.2rem,12vw,3.4rem)/1 var(--f-display);letter-spacing:.02em;color:var(--brown)}
.rb b.em{font-size:clamp(3.2rem,17vw,5rem)}
.rb i{font:400 2.2rem/1 var(--f-display);font-style:normal;color:var(--brown2)}
.rb hr{border:0;border-top:7px solid var(--brown);width:min(15rem,75%);margin:.15rem 0;border-radius:4px}
.rb s{display:inline-block;width:.45em;text-decoration:none}
.rb.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5rem .7rem}
.rb:not(.row){display:grid;gap:.1rem}
.rb img{display:block;width:100%;max-height:22rem;object-fit:contain;border-radius:12px}

.card .field label,.card .meta{color:var(--brown2)}
.card .rb{padding-block:4px}
/* lists */
.rows{list-style:none;padding:0;display:grid;gap:8px}
.rows li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper);color:var(--brown);border-radius:14px;padding:.55rem .8rem;min-width:0;border:3px solid #F3E6C8;box-shadow:0 3px 0 rgba(0,0,0,.14)}
.rows li.cur{border-color:var(--gold);background:#FFF3C7}
.rows li.good{background:#E3F8E9;border-color:#BDEBCB}
.rows li.bad{opacity:.65}
.rows b{font:400 1.1rem var(--f-display);flex:none;color:var(--green2)}
.rows li.bad b{color:var(--red2)}
.rows .t{min-width:0;overflow-wrap:anywhere;font-weight:600}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}

/* imposter */
.plate{display:grid;justify-items:center;gap:4px;align-content:center;min-height:11rem;border-radius:22px;border:4px solid #fff;cursor:pointer;color:#fff;
  background:linear-gradient(rgba(255,255,255,.2),transparent 45%),var(--blue);box-shadow:0 6px 0 var(--blue2),0 12px 18px rgba(0,0,0,.2);position:relative;padding:16px;text-align:center;width:100%}
.plate::before,.plate::after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9DB6E8);box-shadow:0 0 0 2px rgba(0,0,0,.18) inset;top:12px;left:12px}
.plate::after{left:auto;right:12px}
.plate strong{font:400 1.5rem/1.1 var(--f-display);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.plate small{color:#DCE9FF}
.plate svg{filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.rolecard{min-height:11rem;align-content:center;text-align:center;justify-items:center;cursor:pointer;width:100%;font:inherit;animation:flip .45s ease-out}
.rolecard strong{font:400 2.2rem/1.05 var(--f-display);overflow-wrap:anywhere}
.rolecard.imp strong{color:var(--pink2)}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
.vote{display:grid;gap:10px}
.vote button{display:flex;align-items:center;gap:10px;text-align:left;border:3px solid #F3E6C8;background:var(--paper);color:var(--brown);border-radius:16px;min-height:56px;padding:.4rem .9rem;cursor:pointer;box-shadow:0 4px 0 var(--edge)}
.vote button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.vote button.sel{border-color:var(--blue);background:#E3EEFF;box-shadow:0 4px 0 var(--blue2)}

/* forehead */
.sticky{position:relative;background:#FFE76A;color:var(--brown);border-radius:6px 6px 14px 6px;padding:26px 18px 18px;transform:rotate(-1.5deg);display:grid;gap:2px;box-shadow:0 8px 0 rgba(0,0,0,.14),0 14px 20px rgba(0,0,0,.18)}
.sticky::before{content:"";position:absolute;top:-10px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(2deg);background:rgba(255,255,255,.55);border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.1)}
.sticky strong{font:400 2.2rem/1.05 var(--f-display);overflow-wrap:anywhere}
.sticky small{color:#7A5A12;font-weight:600}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa .btn{padding-inline:.4rem}

/* flags */
.flag{aspect-ratio:3/2;width:100%;max-width:100%;border-radius:12px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--edge)}
.flag svg{display:block;width:100%;height:100%}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{min-height:60px;border:3px solid #F3E6C8;border-radius:16px;background:var(--paper);color:var(--brown);padding:.4rem .6rem;font:400 1.1rem/1.1 var(--f-display);cursor:pointer;overflow-wrap:anywhere;box-shadow:0 5px 0 var(--edge),0 8px 12px rgba(0,0,0,.12)}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.opt:disabled{cursor:default}
.opt.sel{background:#E3EEFF;border-color:var(--blue);box-shadow:0 5px 0 var(--blue2)}
.opt.good{background:#D7F6E1;border-color:var(--green);box-shadow:0 5px 0 var(--green2)}
.opt.bad{background:#FFE0E0;border-color:var(--red);box-shadow:0 5px 0 var(--red2);opacity:.85}

/* name animal place thing food */
.letter{justify-self:center;width:8.5rem;height:9.5rem;display:grid;place-items:center;background:var(--paper);color:var(--orange);font:400 6.5rem/1 var(--f-display);border-radius:20px;border:3px solid #F3E6C8;box-shadow:0 7px 0 var(--edge),0 12px 18px rgba(0,0,0,.18)}
.xp{position:relative;height:30px;border-radius:999px;background:#12359B;border:4px solid var(--gold);box-shadow:0 4px 0 var(--gold2);overflow:hidden}
.xp i{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(rgba(255,255,255,.3),transparent 60%),#4DA0FF;border-radius:999px;transition:width .25s linear}
.xp b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:400 1rem var(--f-display);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.cat{display:grid;gap:8px}
.cat h3{font:400 1.2rem var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--fg)}
.cell{display:flex;justify-content:space-between;gap:10px;align-items:center;border:3px solid #F3E6C8;background:var(--paper);color:var(--brown);border-radius:14px;padding:.5rem .8rem;text-align:left;width:100%;min-width:0;box-shadow:0 3px 0 rgba(0,0,0,.14)}
.cell .t{min-width:0;overflow-wrap:anywhere;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cell b{font:400 1.1rem var(--f-display);color:var(--green2);flex:none}
.cell.z{opacity:.6}.cell.z b{color:var(--red2)}
.cell.z .t span{text-decoration:line-through}
.cell:not(:disabled){cursor:pointer}

/* leaderboard */
.board{list-style:none;padding:0;display:grid;gap:8px}
.board li{display:flex;align-items:center;gap:10px;background:var(--paper);color:var(--brown);border-radius:16px;padding:.5rem .8rem;border:3px solid #F3E6C8;box-shadow:0 3px 0 rgba(0,0,0,.14)}
.board .rk{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font:400 1.05rem var(--f-display);background:#EDE2CC;color:var(--brown2)}
.board li:nth-child(1) .rk{background:var(--gold);color:#4A2A0C}
.board li:nth-child(2) .rk{background:#D8DEE8;color:#394150}
.board li:nth-child(3) .rk{background:#E6A66B;color:#4A2A0C}
.board .who{flex:1}
.board b{display:inline-flex;align-items:center;gap:5px;font:400 1.3rem var(--f-display)}
.win{display:grid;justify-items:center;gap:2px;text-align:center}
.win .crown{width:70px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15));animation:pop .5s ease-out}
.win strong{font:400 2rem/1.1 var(--f-display)}
/* game dock */
body{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
body.nodock{padding-bottom:56px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--brown);border-top:3px solid rgba(255,255,255,.25);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 14px rgba(0,0,0,.2)}
.dock div{max-width:30rem;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dock button{min-width:0;min-height:54px;border:0;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font:400 .9rem/1.05 var(--f-display);letter-spacing:.02em;padding:.2rem .1rem;display:grid;gap:3px;justify-items:center;align-content:center;cursor:pointer}
.dock button i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:400 .85rem var(--f-display);font-style:normal;color:#4A2A0C;border:2px solid #fff}
.dock button.on{background:var(--gold);color:#4A2A0C;box-shadow:0 3px 0 var(--gold2)}
.dock button.ask{background:var(--red);animation:pop .2s ease-out}
.dock button:disabled{cursor:default}
.dock button:disabled:not(.on){opacity:.55}
body.typing .dock{display:none}
#toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
/* search, picker, help, settings */
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none}
.search input{padding-left:44px;padding-right:44px}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:#EDE2CC;color:var(--brown2);font:400 1rem var(--f-display);cursor:pointer}
.modal.top{place-items:start center;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.sheet.tall{text-align:left;height:min(100%,36rem);display:flex;flex-direction:column;overflow:hidden}
.sheet h2{text-shadow:none}
.sheet.tall h2{padding-right:44px}
.glist{list-style:none;margin:0;padding:2px 2px 6px;display:grid;gap:10px;overflow:auto;align-content:start;min-height:0;flex:1}
.grow{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:3px solid #F3E6C8;background:var(--paper);color:var(--brown);border-radius:16px;padding:.55rem .8rem;min-height:62px;cursor:pointer;box-shadow:0 4px 0 var(--edge)}
.grow:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.grow:disabled{cursor:default}
.grow .gi{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font:400 1.2rem var(--f-display);color:#4A2A0C;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.grow .gx{display:grid;gap:1px;min-width:0;flex:1}
.grow strong{font:400 1.05rem/1.1 var(--f-display);overflow-wrap:anywhere}
.grow span{font-size:.85rem;font-weight:500;color:var(--brown2)}
.grow .pill{flex:none;font:400 .8rem var(--f-display);background:var(--gold);color:#4A2A0C;border-radius:999px;padding:.25rem .6rem}
.grow.cur{border-color:var(--gold);background:#FFF3C7}
.grow.ask{border-color:var(--red);background:#FFE6E3;box-shadow:0 4px 0 var(--red2)}
.empty{text-align:center;justify-items:center}
.min{display:inline-block;font:400 .75rem var(--f-display);color:var(--brown2);background:#F3E6C8;border-radius:999px;padding:.1rem .55rem;justify-self:center}
.phead{display:flex;align-items:center;gap:12px}
.phead h2{flex:1}
.back{width:46px;height:46px;flex:none;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;cursor:pointer;background:linear-gradient(rgba(255,255,255,.25),transparent 55%),var(--blue);box-shadow:0 4px 0 var(--blue2),0 6px 10px rgba(0,0,0,.2);color:#fff;font:400 1.8rem/1 var(--f-display);padding-bottom:4px}
.back:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue2)}
details.how{padding:0;gap:0}
details.how summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:26px 16px 14px;font:400 1.25rem/1.1 var(--f-display)}
details.how summary::-webkit-details-marker{display:none}
details.how summary::after{content:"";width:12px;height:12px;border-right:4px solid var(--brown2);border-bottom:4px solid var(--brown2);transform:rotate(45deg);margin-right:4px;flex:none;transition:transform .15s}
details.how[open] summary::after{transform:rotate(-135deg)}
details.how ol{margin:0;padding:0 16px 16px;list-style:none;display:grid;gap:10px;counter-reset:s}
details.how li{display:flex;gap:10px;align-items:flex-start;font-weight:500;color:var(--brown2);counter-increment:s}
details.how li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#4A2A0C;display:grid;place-items:center;font:400 .95rem var(--f-display)}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.sw.on{box-shadow:0 0 0 4px var(--blue),0 3px 0 rgba(0,0,0,.18)}
.set{display:grid;gap:12px}
.set h3{font:400 1.2rem var(--f-display);letter-spacing:.02em}
.sheet .big-code{margin:0}
.sheet.tall .note,.sheet.tall .fine{text-align:left}
@media (prefers-reduced-motion:reduce){details.how summary::after{transition:none}}
.tab.purple{--c:var(--purple);color:#fff}
.wc{display:block;width:100%;height:auto}
.wc text{font-family:var(--f-display),'Fredoka',sans-serif}
.mini .wc{width:2.3rem;height:auto;border-radius:0;box-shadow:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.mini .wc+.wc{margin-left:-.4rem;transform:rotate(8deg)}
.wtable{display:flex;align-items:flex-end;justify-content:center;gap:26px;padding-top:4px}
.wtop .wc{width:7.4rem;filter:drop-shadow(0 5px 0 rgba(0,0,0,.14))}
.wmarket{display:grid;justify-items:center;gap:6px;border:0;background:none;padding:0;color:var(--brown);font:400 1rem var(--f-display);cursor:pointer;text-align:center}
.wmarket .wc{width:5.4rem;filter:drop-shadow(0 4px 0 rgba(0,0,0,.14))}
.wmarket:disabled{opacity:.55;cursor:default}
.wmarket.go .wc{animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-5px)}}
.wtop small,.wmarket small{display:block}
.wcap{font:400 .9rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);text-align:center;margin-top:6px}
.card .wcap{color:var(--brown2)}
.wstat{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wchip{display:inline-flex;align-items:center;gap:6px;font:400 1rem var(--f-display);border-radius:999px;padding:.3rem .8rem;background:#FFF0BF;color:var(--brown)}
.wchip.red{background:#FFE0E0;color:#A12A1D}
.wchip svg{width:20px;height:20px}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.1rem,1fr));gap:12px 10px;padding-top:8px}
.wcard{border:0;background:none;padding:0;cursor:pointer;border-radius:10px;transition:transform .12s}
.wcard.ok{transform:translateY(-6px);box-shadow:0 0 0 3px var(--gold),0 6px 0 var(--gold2)}
.wcard.no{filter:brightness(.8) saturate(.55);cursor:default}
.wcard:active.ok{transform:translateY(0)}
.shapes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.shapes .opt{min-height:70px;padding:.3rem .1rem;display:grid;gap:2px;justify-items:center;font:400 .72rem var(--f-display)}
.shapes svg{width:34px;height:34px}
.tiny{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end}
.tiny .wc{width:1.7rem}
.wl{list-style:none;padding:0;margin:0;display:grid;gap:4px;color:var(--fg2);font-size:.95rem;font-weight:500;text-align:center}
.wl li:first-child{color:var(--fg);font-weight:600}
@media (prefers-reduced-motion:reduce){.wmarket.go .wc{animation:none}.wcard{transition:none}}
.tab.red{--c:var(--red);color:#fff}
.lboard{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 0 0 3px #fff,0 4px 0 3px var(--edge)}
.tk.mv{cursor:pointer;outline:none}
.tk.mv .ring{animation:ring 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{50%{transform:scale(1.25);opacity:.4}}
.tk.mv:focus-visible .ring{stroke:var(--gold);stroke-width:.3}
.ldie{display:flex;align-items:center;justify-content:center;gap:16px}
.dieb{border:0;background:none;padding:0;cursor:pointer;width:5.2rem;border-radius:16px}
.dieb:disabled{cursor:default}
.dieb.go{animation:nudge 1.1s ease-in-out infinite;box-shadow:0 0 0 4px var(--gold),0 6px 0 4px var(--gold2)}
.die{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.die.roll{animation:tumble .5s ease-out}
@keyframes tumble{0%{transform:rotate(-200deg) scale(.6)}70%{transform:rotate(12deg) scale(1.1)}100%{transform:none}}
.ltxt{font:400 1.15rem/1.2 var(--f-display);color:var(--brown);display:grid;gap:2px;min-width:0}
.ltxt small{font:500 .9rem var(--f-body);color:var(--brown2)}
.ldot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);display:inline-block}
@media (prefers-reduced-motion:reduce){.tk.mv .ring,.dieb.go,.die.roll{animation:none}}
.lboard.lg .sq{cursor:pointer}
.lboard.lg .sq:focus-visible rect:first-child{stroke:var(--gold);stroke-width:4}
.lgbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lgbtns .btn{flex:1 1 9rem}
.lginfo{display:grid;gap:6px;color:var(--brown);font:500 .95rem/1.3 var(--f-body);min-width:0}
.lginfo h3{margin:0;font:400 1.25rem/1.1 var(--f-display);display:flex;align-items:center;gap:8px}
.lginfo table{border-collapse:collapse;width:100%}.lginfo td{padding:2px 0}.lginfo td:last-child{text-align:right;font-weight:700}
.lglog{list-style:none;margin:0;padding:0;display:grid;gap:4px;color:var(--brown);font:500 .9rem/1.25 var(--f-body)}
.lglog li:last-child{font-weight:700}
.lgsw{width:14px;height:14px;border-radius:4px;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);display:inline-block}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-width:0;border:3px solid #F3E6C8;background:var(--paper);color:var(--brown);border-radius:14px;padding:.55rem .4rem;font:400 1rem/1 var(--f-display);box-shadow:0 3px 0 rgba(0,0,0,.14);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--gold);border-color:var(--gold2);color:#4A2A0C}
.seg button:disabled{opacity:.6;cursor:default}
.botcard{display:grid;gap:10px}.botcard h3{margin:0;font:400 1.15rem/1.1 var(--f-display);color:var(--brown)}
.botcard small{color:var(--brown2);font:500 .85rem/1.3 var(--f-body)}
g.drop{animation:seeddrop .26s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes seeddrop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
.dealin{animation:dealin .4s cubic-bezier(.2,1.2,.4,1)}
@keyframes dealin{from{transform:translateY(70px) scale(.7) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
.wcard.fresh{animation:handin .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes handin{from{transform:translateY(46px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.rows li.cur{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 3px 0 rgba(0,0,0,.14),0 0 0 4px rgba(255,194,46,.45)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:80}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:conf linear forwards}
@keyframes conf{to{transform:translate(var(--dx),108vh) rotate(var(--rot))}}
.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.card,.rows li{transition:box-shadow .2s}
@media (prefers-reduced-motion:reduce){g.drop,.dealin,.wcard.fresh,.rows li.cur,.confetti i{animation:none}}
/* invite popup */
.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(40,22,8,.55);animation:fade .2s ease-out}
.sheet{position:relative;width:100%;max-width:26rem;max-height:calc(100% - 8px);overflow:auto;background:var(--paper);color:var(--brown);border-radius:24px;border:3px solid #fff;padding:22px 18px 18px;display:grid;gap:14px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.2),0 18px 30px rgba(0,0,0,.3);animation:pop .25s ease-out}
.sheet h2{color:var(--brown)}
.sheet .tab{left:50%;transform:translateX(-50%);top:-17px;white-space:nowrap}
.sheet .note{color:var(--brown2)}
.sheet .x{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:0;background:#EDE2CC;color:var(--brown2);font:400 1.1rem var(--f-display);cursor:pointer}
.big-code{display:flex;justify-content:center;gap:6px}
.big-code i{font:400 2.2rem/1 var(--f-display);font-style:normal;color:var(--blue2);background:#E3EEFF;border:3px solid #BBD4FF;width:2.7rem;height:3.4rem;display:grid;place-items:center;border-radius:12px;box-shadow:0 4px 0 #BBD4FF}
.sheet .btn{width:100%;text-decoration:none}
.btn.wa{--c:#25D366;--e:#128C4A}
.sheet .stack{display:grid;gap:12px}
.sheet .fine{font-size:.85rem;color:var(--brown2)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.modal,.sheet{animation:none}}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--brown);color:#fff;padding:.7rem 1.1rem;border-radius:14px;font-weight:600;border:3px solid #fff;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;z-index:12;box-shadow:0 5px 0 rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast,.btn,.gt,.xp i{transition:none}.rows li,.rolecard,.win .crown{animation:none}}

/* ---------- standalone transport: MQTT over secure WebSocket (public brokers) ---------- */
const CODE_ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ';
const MQ_BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const mqBrokers=()=>window.FGN_BROKERS||MQ_BROKERS;
const mqIdx=code=>Math.max(0,CODE_ALPHA.indexOf(String(code).toUpperCase().slice(-1)))%mqBrokers().length;
function mqCode(k){ /* random 5-letter code whose last letter selects broker k */
  const n=mqBrokers().length,pre=Array.from({length:4},()=>CODE_ALPHA[Math.floor(Math.random()*24)]).join('');
  return pre+CODE_ALPHA[k+n*Math.floor(Math.random()*(24/n))];
}
function mqttRoom(code){return new Promise((resolve,reject)=>{
  const lc=String(code).toUpperCase(),url=mqBrokers()[mqIdx(lc)];
  const id=Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
  const base='fgn1/'+lc+'/',pt=base+'p/'+id;
  const peers=new Map(),hs={},cbs=[];let myP=null,ready=false,closed=false;
  const c=mqtt.connect(url,{clientId:'fgn_'+id,keepalive:15,reconnectPeriod:2000,connectTimeout:8000,clean:true,
    will:{topic:pt,payload:'',retain:true,qos:0}});
  const fire=ch=>{const arr=[...peers.values()];cbs.forEach(f=>{try{f({peers:arr,joined:ch.joined||[],left:ch.left||[],updated:ch.updated||[]})}catch(e){console.error(e)}})};
  const setPeer=(pid,pres)=>{const old=peers.get(pid),p={peer:pid,sameTab:pid===id,kind:'viewer',presence:pres};peers.set(pid,p);fire(old?{updated:[p]}:{joined:[p]})};
  const pubP=()=>{if(myP)c.publish(pt,JSON.stringify(myP),{retain:true,qos:0})};
  const timer=setTimeout(()=>{if(!ready){closed=true;try{c.end(true)}catch(e){}reject(new Error('timeout'))}},9000);
  c.on('connect',()=>{
    c.subscribe([base+'ev/#',base+'p/+',base+'to/'+id],{qos:0},err=>{
      if(err){if(!ready){clearTimeout(timer);reject(err)}return}
      if(!ready){ready=true;clearTimeout(timer);resolve(room)}else pubP();
    });
  });
  c.on('error',e=>{if(!ready&&!closed){closed=true;clearTimeout(timer);try{c.end(true)}catch(_){}reject(e)}});
  c.on('message',(topic,buf)=>{
    if(topic.startsWith(base+'p/')){
      const pid=topic.slice(base.length+2);
      if(!buf.length){const o=peers.get(pid);if(o&&pid!==id){peers.delete(pid);fire({left:[o]})}return}
      let pres;try{pres=JSON.parse(buf.toString())}catch(e){return}
      if(pid===id&&!myP)return;
      if(pres&&typeof pres==='object')setPeer(pid,pres);return;
    }
    let m;try{m=JSON.parse(buf.toString())}catch(e){return}
    if(!m||typeof m.f!=='string')return;
    const t=topic.startsWith(base+'to/')?m.t:topic.slice(base.length+3);
    const h=hs[t];if(h)try{h({peer:m.f,data:m.d,sameTab:m.f===id,kind:'viewer'})}catch(e){console.error(e)}
  });
  const room={
    code:lc,
    emit:async(t,d)=>{
      if(t==='pv'&&d&&d.to)c.publish(base+'to/'+d.to,JSON.stringify({f:id,t,d}),{qos:0});
      else c.publish(base+'ev/'+t,JSON.stringify({f:id,d}),{qos:0});
    },
    on:(t,fn)=>{hs[t]=fn},
    presence:async p=>{myP=Object.assign({},myP||{},p);setPeer(id,myP);pubP()},
    peers:()=>[...peers.values()],
    onPeers:fn=>{cbs.push(fn)},
    leave:async()=>{closed=true;myP=null;await new Promise(r=>{const t=setTimeout(r,600);try{c.publish(pt,'',{retain:true,qos:0},()=>{clearTimeout(t);r()})}catch(e){r()}});try{c.end(true)}catch(e){}}
  };
});}

/* Fallback when a private room cannot be opened: share the lobby room and tag everything with the room code. */
function lobbyRoom(ns,tag){
  const mine=p=>p&&p.presence&&p.presence.rc===tag,seen=new Set();
  return {
    emit:(t,d)=>ns.emit(t,{rc:tag,d}),
    on:(t,fn,err)=>ns.on(t,m=>{const x=m.data;if(x&&x.rc===tag)fn(Object.assign({},m,{data:x.d}))},err),
    presence:p=>ns.presence(Object.assign({rc:tag},p)),
    peers:()=>ns.peers().filter(mine),
    onPeers:(fn,err)=>ns.onPeers(c=>{
      const now=c.peers.filter(mine),joined=[];
      now.forEach(p=>{if(!seen.has(p.peer)){seen.add(p.peer);joined.push(p)}});
      fn({peers:now,joined,left:c.left.filter(p=>seen.delete(p.peer)||true),updated:c.updated.filter(mine)});
    },err),
    leave:async()=>{try{await ns.presence({rc:null,n:null,c:null,j:null})}catch(e){}}
  };
}

    case 'wstart':if(H&&S.g==='whot'&&S.ph==='setup')whotStart();break;
    case 'wp':if(S.g==='whot')whotPlay(from,String(d.c),d.s);break;
    case 'wd':if(S.g==='whot')whotDraw(from);break;
    case 'wagain':if(H&&S.g==='whot'&&S.ph==='end'){whotSetup();whotStart()}break;
    case 'lroll':if(S.g==='ludo')ludoRoll(from);break;
    case 'lmove':if(S.g==='ludo')ludoMove(from,d.i|0);break;
    case 'lskip':if(H&&S.g==='ludo'&&(S.ph==='roll'||S.ph==='move')){S.mv=[];ludoNext(false)}break;
    case 'mr':if(S.g==='lag')lgRoll(from);break;
    case 'mb':if(S.g==='lag')lgBuy(from);break;
    case 'ms':if(S.g==='lag')lgPass(from);break;
    case 'me':if(S.g==='lag'&&S.ph==='after'&&lgCur()===from)lgNext();break;
    case 'mh':if(S.g==='lag')lgBuild(from,d.q|0);break;
    case 'mj':if(S.g==='lag')lgBail(from);break;
    case 'mk':if(H&&S.g==='lag'&&['roll','after','buy'].includes(S.ph)){lgLog(nameOf(lgCur())+' was skipped.');lgNext()}break;
    case 'ay':if(S.g==='ayo')ayoMove(from,d.i|0);break;
    case 'ak':if(H&&S.g==='ayo'&&S.ph==='play'){S.lg=nameOf(S.pl[S.t])+' was skipped.';S.lp=[];S.lc=[];ayoAdvance()}break;
    case 'bots':if(H&&!S.g){const n=Math.max(0,Math.min(3,d.n|0)),l=[1,2,3].includes(d.l)?d.l:(S.bl||2);
      S.bots=Array.from({length:n},(_,k)=>({id:'bot_'+(k+1),n:BOT_NAMES[k]+' (bot)',c:(k+3)&7,l}));S.bl=l;pub()}break;
    case 'wskip':if(H&&S.g==='whot'&&S.ph==='play'){S.pend=0;S.pr=0;whotAdv(1);whotAfter()}break;
    case 'resetsc':if(H){S.sc={};if(HP.base)HP.base={};pub()}break;
    case 'lobby':if(H)toLobby();break;

    case 'hstart':if(H&&S.g==='head'&&S.ph==='setup')headStart();break;

    case 'fa':if(S.g==='flag')flagAnswer(from,d.o);break;

    case 'tally':if(H&&S.g==='imp'&&S.ph==='vote')impTally();break;

function rebusStart(){const deck=shuffle(REBUS.map((_,i)=>i)).slice(0,8);HP={deck};const S=reset('rebus');S.ph='play';S.n=0;S.N=deck.length;S.pz=deck[0];S.ok=[];pub()}

function impStart(){

  const cat=pick(IMP),word=pick(cat.w),imp=pick(pl);HP={word,imp};

function impClue(from,x){

function impTally(){
  const S=G.S,c={};Object.values(S.vt).forEach(t=>c[t]=(c[t]||0)+1);
  const e=Object.entries(c).sort((a,b)=>b[1]-a[1]);

function impGuess(from,x){

/* Person on the forehead */
function headSetup(){HP={cu:[]};const S=reset('head');S.ph='setup';S.cn=0;pub()}
function headStart(){
  const pl=ids();if(pl.length<2){toast('You need at least 2 players.');return}
  const pool=[...shuffle(HP.cu),...shuffle(HEADS).map(x=>({x,by:null}))];
  let ord,tries=0;
  do{ord=shuffle(pl);tries++}while(tries<40&&ord.some((id,i)=>pool[i].by===id));
  HP.id={};ord.forEach((id,i)=>{HP.id[id]=pool[i].x});
  const S=reset('head');S.pl=pl;S.ph='play';S.o=pl;S.t=0;S.lg=[];S.sol=[];S.pq=null;S.qn={};S.rv={};
  pl.forEach(id=>{const m={};pl.forEach(o=>{if(o!==id)m[o]=HP.id[o]});sendPv(id,{k:'ids',m})});
  pub();
}
function headNextTurn(){const S=G.S,n=S.o.length;for(let k=1;k<=n;k++){const i=(S.t+k)%n;if(!S.sol.includes(i)&&present(S.o[i])){S.t=i;return true}}return false}
function headEnd(){const S=G.S;S.ph='end';S.rv={};S.o.forEach((id,i)=>{S.rv[i]=HP.id[id]});S.pq=null;pub()}
function headAnswer(a){
  const S=G.S;S.lg.push({b:S.t,x:S.pq,a});if(S.lg.length>8)S.lg.shift();
  S.pq=null;S.qn[S.t]=(S.qn[S.t]||0)+1;

}
function headGuess(from,x){
  const S=G.S,name=HP.id[from],g=norm(x),nn=norm(name);x=String(x||'').trim().slice(0,30);if(!g)return;
  const ok=g===nn||(g.length>=4&&nn.includes(g));

    S.lg.push({b:S.t,x:'Guessed it: '+name,a:'w'});if(S.lg.length>8)S.lg.shift();
    if(S.sol.length>=S.pl.filter(present).length||!headNextTurn()){headEnd();return}
  }else{
    S.lg.push({b:S.t,x:'Guess: '+x,a:'x'});if(S.lg.length>8)S.lg.shift();
    if(!headNextTurn()){headEnd();return}

}

/* Whot */
function whotSetup(){
  const ru=(G.S.g==='whot'&&G.S.ru)||{1:1,2:1,5:1,8:1,14:1};
  HP={};const S=reset('whot');S.ph='setup';S.ru={...ru};pub();
}
function whotHands(){const S=G.S;S.pl.forEach(id=>{if(HP.hands[id])sendPv(id,{k:'hand',h:HP.hands[id]})})}
function whotCounts(){const S=G.S;S.hc={};S.pl.forEach(id=>{S.hc[id]=HP.hands[id].length});S.dk=HP.draw.length}
function whotAfter(){whotCounts();pub();whotHands()}
function whotLog(ev){const S=G.S;S.lg.push(ev);while(S.lg.length>5)S.lg.shift()}
function whotStart(){
  const S0=G.S,pl=ids();if(pl.length<2){toast('Whot needs at least 2 players.');return}
  const ru=S0.ru,draw=shuffle(WDECK()),hands={};
  pl.forEach(id=>{hands[id]=[]});
  for(let k=0;k<6;k++)pl.forEach(id=>hands[id].push(draw.pop()));
  const special=[1,2,5,8,14,20];let i=draw.length-1;while(i>0&&special.includes(wcn(draw[i])))i--;
  const top=draw.splice(i,1)[0];
  HP={draw,disc:[top],hands};
  const S=reset('whot');S.ph='play';S.ru=ru;S.pl=pl;S.top=top;S.want=null;S.pend=0;S.pr=0;S.t=0;S.lg=[];
  whotAfter();
}
function whotTake(id,n){
  let got=0;
  for(let k=0;k<n;k++){
    if(!HP.draw.length){const top=HP.disc.pop();HP.draw=shuffle(HP.disc);HP.disc=[top]}
    if(!HP.draw.length)break;
    HP.hands[id].push(HP.draw.pop());got++;
  }
  return got;
}
function whotAdv(k){
  const S=G.S,n=S.pl.length;let c=0,i=S.t;
  for(let s=0;s<n*3&&c<k;s++){i=(i+1)%n;if(present(S.pl[i]))c++}
  S.t=i;
}
function whotEnd(winner){
  const S=G.S;S.ph='end';S.wn=winner;S.rh={};
  S.pl.forEach(id=>{S.rh[id]=HP.hands[id].slice()});
  if(winner)addSc(winner,5);
  whotCounts();pub();
}
function whotPlay(from,c,shape){
  const S=G.S;if(S.ph!=='play'||S.pl[S.t]!==from)return;
  const h=HP.hands[from],i=h.indexOf(c);
  if(i<0||!whotCan(c,S))return;
  if(c==='w20'&&!WSHAPES.includes(shape))return;
  h.splice(i,1);HP.disc.push(c);S.top=c;S.want=c==='w20'?shape:null;
  const n=wcn(c),ru=S.ru,ev={p:from,k:'play',c};
  if(c==='w20')ev.s=shape;
  whotLog(ev);
  if(!h.length){whotEnd(from);whotHands();return}
  if(n===2&&ru[2]){S.pend+=2;S.pr=2;whotAdv(1)}
  else if(n===5&&ru[5]){S.pend+=3;S.pr=5;whotAdv(1)}
  else if(n===8&&ru[8]){ev.x='susp';whotAdv(2)}
  else if(n===1&&ru[1]){ev.x='hold'}
  else if(n===14&&ru[14]){ev.x='market';S.pl.forEach(id=>{if(id!==from)whotTake(id,1)})}
  else whotAdv(1);

}
function whotDraw(from){
  const S=G.S;if(S.ph!=='play'||S.pl[S.t]!==from)return;
  const pen=S.pend>0,got=whotTake(from,pen?S.pend:1);
  whotLog({p:from,k:'draw',n:got,pen:pen?1:0});
  S.pend=0;S.pr=0;whotAdv(1);whotAfter();

/* Ludo */
const randInt=(a,b)=>a+Math.floor((crypto.getRandomValues(new Uint32Array(1))[0]/4294967296)*(b-a+1));
function ludoStart(){

  const P=pl.slice(0,4);HP={};
  const S=reset('ludo');S.pl=P;S.co={};S.tk={};

function ludoNext(extra){

  if(!extra){let i=S.t;for(let k=0;k<n*2;k++){i=(i+1)%n;if(present(S.pl[i]))break}S.t=i;S.sx=0}

function ludoPassSoon(){clearTimeout(HP.t);HP.t=setTimeout(()=>{if(G.S&&G.S.g==='ludo'&&G.S.ph==='pass')ludoNext(false)},1500)}
function ludoRoll(from){
  const S=G.S;if(S.ph!=='roll'||S.pl[S.t]!==from)return;
  const d=randInt(1,6);S.d=d;S.rn++;S.ev=null;
  if(d===6)S.sx++;
  if(d===6&&S.sx>=3){S.ev={p:from,k:'six3'};S.mv=[];S.ph='pass';pub();ludoPassSoon();return}
  S.mv=[0,1,2,3].filter(i=>ludoLegal(S.tk[from][i],d));

}
function ludoMove(from,i){
  const S=G.S;if(S.ph!=='move'||S.pl[S.t]!==from||!S.mv.includes(i))return;
  const tk=S.tk[from],p=tk[i],d=S.d,np=p<0?0:p+d;tk[i]=np;
  let extra=d===6;const ev={p:from,k:'move'};

    const abs=(S.co[from]*13+np)%52;
    if(!LSAFE.has(abs)){
      let n=0;
      S.pl.forEach(o=>{if(o===from)return;const so=S.co[o]*13;
        S.tk[o]=S.tk[o].map(q=>(q>=0&&q<=50&&(so+q)%52===abs)?(n++,-1):q)});
      if(n){extra=true;ev.k='cap';ev.n=n}
    }
  }
  S.ev=ev;
  if(tk.every(q=>q===56)){clearTimeout(HP.t);S.ph='end';S.wn=from;S.mv=[];addSc(from,5);pub();return}
  ludoNext(extra);
}

/* Lagos Landlords */
function lgStart(){

  HP={};const S=reset('lag');S.pl=pl;S.mp={};S.ca={};S.jl={};S.bk={};S.ow={};S.lv={};

const lgCur=()=>G.S.pl[G.S.t];
function lgLog(m){const S=G.S;S.lg=(S.lg||[]).concat(m).slice(-8)}
const lgOwned=(S,id)=>Object.keys(S.ow).filter(k=>S.ow[k]===id).map(Number);
const lgMono=(S,id,g)=>LSQ.every((q,i)=>q.g!==g||S.ow[i]===id);
function lgRent(S,pos,ds){
  const q=LSQ[pos],o=S.ow[pos];
  if(q.k==='prop'){const lv=S.lv[pos]|0;return lv?q.r*LMUL[lv]:(lgMono(S,o,q.g)?q.r*2:q.r)}
  if(q.k==='stn')return 25*Math.pow(2,LSQ.filter((x,i)=>x.k==='stn'&&S.ow[i]===o).length-1);
  return (LSQ.filter((x,i)=>x.k==='utl'&&S.ow[i]===o).length>1?10:4)*ds;
}
function lgWorth(S,id){let w=S.ca[id]||0;lgOwned(S,id).forEach(p=>{const q=LSQ[p];w+=q.p+(q.k==='prop'?(S.lv[p]|0)*lgBuildCost(q):0)});return w}
function lgPay(id,to,amt){
  const S=G.S;
  if(S.ca[id]>=amt){S.ca[id]-=amt;if(to)S.ca[to]+=amt;return true}
  if(to)S.ca[to]+=S.ca[id];S.ca[id]=0;S.bk[id]=1;
  lgOwned(S,id).forEach(p=>{if(to)S.ow[p]=to;else{delete S.ow[p];delete S.lv[p]}});
  delete S.jl[id];lgLog(nameOf(id)+' went bankrupt!');return false;
}
function lgCheckEnd(){
  const S=G.S,a=S.pl.filter(id=>!S.bk[id]);
  if(a.length>1)return false;
  S.ph='end';S.wn=a[0]||null;if(S.wn)addSc(S.wn,5);pub();return true;
}
const LG_ROUNDS=25;
function lgFinish(){const S=G.S,a=S.pl.filter(id=>!S.bk[id]).sort((x,y)=>lgWorth(S,y)-lgWorth(S,x));S.ph='end';S.wn=a[0]||null;if(S.wn)addSc(S.wn,5);pub()}
function lgNext(){
  const S=G.S,n=S.pl.length;let pk=-1;
  S.tn++;if(S.tn>=LG_ROUNDS*n){lgLog('Time is up! The richest landlord wins.');lgFinish();return}
  for(let k=1;k<=n&&pk<0;k++){const j=(S.t+k)%n,id=S.pl[j];if(!S.bk[id]&&present(id))pk=j}
  for(let k=1;k<=n&&pk<0;k++){const j=(S.t+k)%n;if(!S.bk[S.pl[j]])pk=j}
  if(pk>=0)S.t=pk;S.ph='roll';S.rd=false;S.dc=0;pub();
}
function lgAfter(){
  const S=G.S,id=lgCur();
  if(lgCheckEnd())return;
  if(S.bk[id]){lgNext();return}
  S.ph=(S.rd&&S.jl[id]==null)?'roll':'after';pub();
}
function lgJail(id){const S=G.S;S.mp[id]=7;S.jl[id]=0;S.rd=false}
function lgMoveBy(id,n){
  const S=G.S,f=S.mp[id];
  if(n>0&&f+n>=28){S.ca[id]+=150;lgLog(nameOf(id)+' passed Start: +₦150k')}
  S.mp[id]=(f+n+28)%28;
}
function lgRoll(from){
  const S=G.S;if(S.ph!=='roll'||lgCur()!==from)return;
  const a=randInt(1,6),b=randInt(1,6),dbl=a===b,nm=nameOf(from);S.d=[a,b];S.rn++;
  if(S.jl[from]!=null){
    if(dbl){delete S.jl[from];S.rd=false;lgLog(nm+' rolled doubles and left jail.');lgMoveBy(from,a+b);lgLand(from);return}
    S.jl[from]++;
    if(S.jl[from]>=3){delete S.jl[from];lgLog(nm+' paid ₦50k to leave jail.');if(!lgPay(from,null,50)){lgAfter();return}S.rd=false;lgMoveBy(from,a+b);lgLand(from);return}
    S.rd=false;lgLog(nm+' stays in jail ('+S.jl[from]+'/3).');S.ph='after';pub();return;
  }
  S.dc=dbl?S.dc+1:0;
  if(dbl&&S.dc>=3){lgLog(nm+' rolled three doubles. Go to jail!');lgJail(from);S.ph='after';pub();return}
  S.rd=dbl;lgMoveBy(from,a+b);lgLand(from);
}
function lgLand(id){
  const S=G.S,pos=S.mp[id],q=LSQ[pos],nm=nameOf(id);
  if(q.k==='prop'||q.k==='stn'||q.k==='utl'){
    const o=S.ow[pos];
    if(o==null){
      if(S.ca[id]>=q.p){S.ph='buy';lgLog(nm+' landed on '+q.n+'.');pub();return}
      lgLog(nm+' landed on '+q.n+' but cannot afford it.');
    }else if(o!==id){const r=lgRent(S,pos,S.d[0]+S.d[1]);lgLog(nm+' paid ₦'+r+'k rent to '+nameOf(o)+'.');lgPay(id,o,r)}
  }else if(q.k==='tax'){lgLog(nm+' paid ₦'+q.p+'k tax.');lgPay(id,null,q.p)}
  else if(q.k==='gojail'){lgLog(nm+' goes to jail.');lgJail(id)}
  else if(q.k==='chest'||q.k==='chance'){if(lgCard(id,q.k))return}
  lgAfter();
}
function lgCard(id,kind){
  const S=G.S,[t,k,v]=pick(LCARDS[kind]);lgLog(nameOf(id)+': '+t);
  if(k==='cash'){if(v>0)S.ca[id]+=v;else lgPay(id,null,-v)}
  else if(k==='each'){for(const o of S.pl){if(o===id||S.bk[o])continue;if(v>0)lgPay(o,id,v);else if(!lgPay(id,o,-v))break}}
  else if(k==='jail')lgJail(id);
  else if(k==='move'){if(v<S.mp[id]){S.ca[id]+=150;lgLog(nameOf(id)+' passed Start: +₦150k')}S.mp[id]=v;if(v!==0)lgLand(id);else lgAfter();return true}
  else if(k==='back'){S.mp[id]=(S.mp[id]-v+28)%28;lgLand(id);return true}
  return false;
}
function lgBuy(from){
  const S=G.S;if(S.ph!=='buy'||lgCur()!==from)return;
  const pos=S.mp[from],q=LSQ[pos];if(S.ca[from]<q.p||S.ow[pos]!=null)return;
  S.ca[from]-=q.p;S.ow[pos]=from;lgLog(nameOf(from)+' bought '+q.n+' for ₦'+q.p+'k.');lgAfter();
}
function lgPass(from){const S=G.S;if(S.ph!=='buy'||lgCur()!==from)return;lgLog(nameOf(from)+' passed on '+LSQ[S.mp[from]].n+'.');lgAfter()}
function lgBuild(from,q){
  const S=G.S,sq=LSQ[q];
  if(!sq||sq.k!=='prop'||lgCur()!==from||!['roll','after'].includes(S.ph)||S.ow[q]!==from||!lgMono(S,from,sq.g))return;
  const lv=S.lv[q]|0,c=lgBuildCost(sq);if(lv>=3||S.ca[from]<c)return;
  S.ca[from]-=c;S.lv[q]=lv+1;lgLog(nameOf(from)+' built a floor on '+sq.n+'.');pub();
}
function lgBail(from){
  const S=G.S;if(S.ph!=='roll'||lgCur()!==from||S.jl[from]==null||S.ca[from]<50)return;
  S.ca[from]-=50;delete S.jl[from];lgLog(nameOf(from)+' paid ₦50k to leave jail.');pub();
}

/* Ayo */
function ayoStart(){
  const all=ids(),n=[12,6,4,3,2].find(x=>x<=all.length);
  if(!n){toast('Ayo needs at least 2 players.');return}
  const pl=all.slice(0,n);HP={};const S=reset('ayo');
  S.pl=pl;S.pt=Array(12).fill(4);S.cp={};pl.forEach(id=>S.cp[id]=0);
  S.t=0;S.ph='play';S.mn=0;S.lp=[];S.lk='';S.lc=[];S.lf=-1;S.wn=null;S.wt=[];S.lg='';pub();
}
const ayoOwner=(S,i)=>S.pl[Math.floor(i/(12/S.pl.length))];
const ayoHeld=(S,id)=>S.pt.reduce((a,v,i)=>a+(ayoOwner(S,i)===id?v:0),0);
function ayoEnd(){
  const S=G.S;
  S.pt.forEach((v,i)=>{S.cp[ayoOwner(S,i)]+=v;S.pt[i]=0});
  const best=Math.max(...S.pl.map(id=>S.cp[id]));
  S.wt=S.pl.filter(id=>S.cp[id]===best);S.wn=S.wt[0];
  S.wt.forEach(id=>addSc(id,5));S.ph='end';S.lp=[];S.lc=[];pub();
}
function ayoAdvance(){
  const S=G.S,n=S.pl.length;
  for(let k=1;k<=n;k++){const j=(S.t+k)%n;if(ayoHeld(S,S.pl[j])>0){S.t=j;pub();return}}
  ayoEnd();
}
function ayoRun(S,from,i){
  const pt=S.pt.slice();let n=pt[i],p=i;pt[i]=0;
  const sown=[],lk=[],caps={},cap=[];
  while(n>0){
    p=(p+1)%12;if(p===i)continue;
    pt[p]++;n--;sown.push(p);
    let hit=0;
    if(pt[p]===4){ /* a pit that fills up to 4 is taken: by its owner, unless the run ends here, then by the mover */
      const taker=n===0?from:ayoOwner(S,p);caps[taker]=(caps[taker]||0)+4;pt[p]=0;cap.push(p);hit=1;
    }
    lk.push(hit);
  }
  return {pt,sown,lk,caps,cap};
}
function ayoMove(from,i){
  const S=G.S;
  if(S.ph!=='play'||S.pl[S.t]!==from||i<0||i>11||ayoOwner(S,i)!==from||!S.pt[i])return;
  const r=ayoRun(S,from,i);
  S.pt=r.pt;S.mn++;S.lp=r.sown;S.lk=r.lk.join('');S.lc=r.cap;S.lf=i;
  const parts=Object.keys(r.caps).map(id=>nameOf(id)+' took '+(r.caps[id]/4>1?r.caps[id]/4+' houses':'a house'));
  Object.keys(r.caps).forEach(id=>S.cp[id]+=r.caps[id]);
  S.lg=nameOf(from)+' sowed '+r.sown.length+(r.sown.length===1?' seed':' seeds')+(parts.length?'. '+parts.join(', ')+'.':'.');
  if(S.cp[from]>=25||Object.values(S.cp).some(v=>v>=25)){ayoEnd();return}
  const holders=S.pl.filter(id=>ayoHeld(S,id)>0);
  if(holders.length<=1||S.mn>=300){ayoEnd();return}
  ayoAdvance();
}

/* ---------- computer players ---------- */
const BOT_NAMES=['Bisi','Tunde','Zainab','Obinna','Efe','Halima'];
const BOT_MS=()=>window.BOT_FAST?[0,0]:[800,800];
const botLvl=id=>((G.S&&G.S.bots||[]).find(b=>b.id===id)||{}).l||1;
function botDue(S){
  if(!S||!S.g||!S.pl||!BOTGAMES.includes(S.g))return null;
  const cur=S.pl[S.t];if(!isBot(cur))return null;
  const ok={whot:['play'],ludo:['roll','move'],lag:['roll','buy','after'],ayo:['play']}[S.g];
  return ok.includes(S.ph)?cur:null;
}
function botTick(){
  const S=G.S;clearTimeout(HP.bt);
  const cur=botDue(S);if(!cur)return;
  const s0=S.s,[a,b]=BOT_MS();
  const wait=Math.max(0,(AN.busy||0)-Date.now());
  HP.bt=setTimeout(()=>{if(G.S&&G.S.s===s0&&botDue(G.S)===cur)botAct(cur)},wait+a+Math.random()*b);
}
function botAct(id,lv){
  const S=G.S;lv=lv||botLvl(id);
  ({whot:botWhot,ludo:botLudo,lag:botLag,ayo:botAyo})[S.g](id,lv);
}
function botWhot(id,lv){
  const S=G.S,h=HP.hands[id]||[],ok=h.filter(c=>whotCan(c,S));
  if(!ok.length){handle(id,{t:'wd'});return}
  const cnt={};h.forEach(c=>{if(c!=='w20')cnt[wcs(c)]=(cnt[wcs(c)]||0)+1});
  const shapeFor=()=>WSHAPES.slice().sort((a,b)=>(cnt[b]||0)-(cnt[a]||0)||Math.random()-.5)[0];
  const play=c=>handle(id,{t:'wp',c,s:c==='w20'?shapeFor():undefined});
  if(lv===1){if(Math.random()<.2&&!S.pend){handle(id,{t:'wd'});return}const c=pick(ok);handle(id,{t:'wp',c,s:c==='w20'?pick(WSHAPES):undefined});return}
  if(h.length===1||ok.length===1){play(ok[0]);return}
  const opp=S.pl.filter(o=>o!==id).map(o=>S.hc[o]||9),minOpp=Math.min(...opp);
  const score=c=>{
    if(c==='w20')return h.length<=2?5:-50;
    const n=wcn(c);let s=(cnt[wcs(c)]||0)*2+Math.random()*(lv===2?3:.5);
    const act=[1,2,5,8,14].includes(n)&&S.ru[n];
    if(act){s+=lv===3?(minOpp<=2?12:(h.length<=3?4:1)):1}
    if(lv===3)s+=n>=10?1:0;
    return s;
  };
  play(ok.slice().sort((a,b)=>score(b)-score(a))[0]);
}
function botLudo(id,lv){
  const S=G.S;
  if(S.ph==='roll'){handle(id,{t:'lroll'});return}
  if(S.ph!=='move')return;
  const mv=S.mv,tk=S.tk[id],d=S.d,co=S.co[id];
  if(lv===1){handle(id,{t:'lmove',i:pick(mv)});return}
  const hit=(abs,skip)=>{let c=0;S.pl.forEach(o=>{if(o===skip)return;S.tk[o].forEach(q=>{if(q>=0&&q<=50&&(S.co[o]*13+q)%52===abs)c++})});return c};
  const threat=abs=>{let c=0;S.pl.forEach(o=>{if(o===id)return;S.tk[o].forEach(q=>{if(q>=0&&q<=50){const oa=(S.co[o]*13+q)%52,dist=(abs-oa+52)%52;if(dist>=1&&dist<=6)c++}})});return c};
  const score=i=>{
    const p=tk[i],np=p<0?0:p+d;let s=np*.3+Math.random()*(lv===2?4:.5);
    if(np===56)s+=100;
    if(p<0)s+=55;
    if(np<=50){
      const abs=(co*13+np)%52;
      if(!LSAFE.has(abs))s+=hit(abs,id)*90;else s+=14;
      if(lv>=3){
        if(!LSAFE.has(abs))s-=threat(abs)*28;
        if(p>=0&&p<=50){const ca=(co*13+p)%52;if(!LSAFE.has(ca))s+=threat(ca)*24}
      }
    }else s+=24;
    return s;
  };
  handle(id,{t:'lmove',i:mv.slice().sort((a,b)=>score(b)-score(a))[0]});
}
function botLag(id,lv){
  const S=G.S;
  if(S.ph==='roll'){
    if(lv>=2&&S.jl[id]!=null&&S.ca[id]>=250)handle(id,{t:'mj'});
    handle(id,{t:'mr'});return;
  }
  if(S.ph==='buy'){
    const pos=S.mp[id],q=LSQ[pos],ca=S.ca[id];let buy;
    if(lv===1)buy=Math.random()<.5;
    else{
      const completes=q.k==='prop'&&LSQ.every((x,i)=>x.g!==q.g||i===pos||S.ow[i]===id);
      buy=completes||ca-q.p>=(lv===2?150:100);
    }
    handle(id,{t:buy?'mb':'ms'});return;
  }
  if(S.ph==='after'){
    if(lv>=2){
      for(let i=0;i<28;i++){const q=LSQ[i];
        if(q.k==='prop'&&S.ow[i]===id&&lgMono(S,id,q.g)&&(S.lv[i]|0)<3&&S.ca[id]-lgBuildCost(q)>=(lv===2?300:180))handle(id,{t:'mh',q:i});
      }
    }
    handle(id,{t:'me'});
  }
}
function botAyo(id,lv){
  const S=G.S,opts=S.pt.map((v,i)=>v>0&&ayoOwner(S,i)===id?i:-1).filter(i=>i>=0);
  if(!opts.length)return;
  if(lv===1){handle(id,{t:'ay',i:pick(opts)});return}
  const gain=(r,who)=>(r.caps[who]||0)-Object.keys(r.caps).filter(k=>k!==who).reduce((a,k)=>a+r.caps[k],0);
  const best=(St,who)=>{let b={g:-99,r:null};St.pt.forEach((v,j)=>{if(v>0&&ayoOwner(St,j)===who){const r=ayoRun(St,who,j),g=gain(r,who);if(g>b.g)b={g,r}}});return b};
  const score=i=>{
    const r=ayoRun(S,id,i);let s=gain(r,id)*10+Math.random()*(lv===2?6:1.5);
    if(lv>=3){
      const S2={pl:S.pl,pt:r.pt},n=S.pl.length;let nx=null;
      for(let k=1;k<n;k++){const o=S.pl[(S.t+k)%n];if(ayoHeld(S2,o)>0){nx=o;break}}
      if(nx){const b=best(S2,nx);if(b.r){s-=Math.max(b.g,0)*8;const m=best({pl:S.pl,pt:b.r.pt},id);if(m.r)s+=Math.max(m.g,0)*4}}
    }
    return s;
  };
  handle(id,{t:'ay',i:opts.slice().sort((a,b)=>score(b)-score(a))[0]});
}

let AC=null;
function tone(f,d=.08,type='sine',v=.06,when=0){
  if(!PREF.sound)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}

/* ---- Ludo: tokens step along the track ---- */
const ludoView=S=>AN.lu?{...S,tk:AN.lu.tk}:S;
const paintLudo=()=>{const b=document.getElementById('lub');if(b&&G.S&&G.S.g==='ludo'){const S=G.S;b.innerHTML=ludoBoard(ludoView(S),S.pl[S.t],(S.ph==='move'&&!AN.lu)?S.mv:[])}};
const paintLudoDie=()=>{const S=G.S;if(S&&S.g==='ludo')dieAt('lud',AN.rolling?rnd6():S.d,AN.rolling)};
function ludoAnim(S){
  const clone=o=>JSON.parse(JSON.stringify(o));
  if(AN.lur!==S.r){AN.lur=S.r;AN.lurn=S.rn;AN.lutk=clone(S.tk);AN.lu=null;return}
  const prev=AN.lutk;AN.lutk=clone(S.tk);
  const rolled=S.rn!==AN.lurn;AN.lurn=S.rn;
  clearInterval(AN.lut);clearTimeout(AN.lus);
  const steps=[],cap=[];
  S.pl.forEach(id=>S.tk[id].forEach((p,i)=>{
    const o=prev[id]?prev[id][i]:p;
    if(p>o){if(o<0)steps.push([id,i,0]);else for(let q=o+1;q<=p;q++)steps.push([id,i,q])}
    else if(p<o&&p<0)cap.push([id,i]);
  }));
  AN.lu=null;
  if(S.ph==='end'||rm()||(!rolled&&!steps.length&&!cap.length))return;
  const disp=clone(prev),delay=rolled?560:0;
  AN.lu={tk:disp};
  AN.busy=Date.now()+delay+steps.length*140+(cap.length?500:0)+150;
  if(rolled)diceTumble(paintLudoDie,()=>{});
  paintLudo();
  AN.lus=setTimeout(()=>{
    let k=0;
    AN.lut=setInterval(()=>{
      if(k<steps.length){const[id,i,q]=steps[k++];disp[id][i]=q;snd('drop',k);paintLudo()}
      else{
        clearInterval(AN.lut);
        const fin=()=>{AN.lu=null;render()};
        if(cap.length){snd('cap');buzz(40);setTimeout(fin,450)}else fin();
      }
    },140);
  },delay);
}

/* ---- Lagos Landlords: pawn walks square by square ---- */
const lgView=S=>AN.lg?{...S,mp:AN.lg.mp}:S;
const paintLag=()=>{const b=document.getElementById('lgb');if(b&&G.S&&G.S.g==='lag')b.innerHTML=lgBoard(lgView(G.S),G.ui.lgsel!=null?G.ui.lgsel:null)};
const paintLagDice=()=>{const S=G.S;if(S&&S.g==='lag'){dieAt('lgd0',AN.rolling?rnd6():S.d[0],AN.rolling);dieAt('lgd1',AN.rolling?rnd6():S.d[1],AN.rolling)}};
function lagAnim(S){
  if(AN.lgr!==S.r){AN.lgr=S.r;AN.lgrn=S.rn;AN.lgmp={...S.mp};AN.lg=null;return}
  const prev=AN.lgmp;AN.lgmp={...S.mp};
  const rolled=S.rn!==AN.lgrn;AN.lgrn=S.rn;
  clearInterval(AN.lgt);clearTimeout(AN.lgs);AN.lg=null;
  if(S.ph==='end'||rm())return;
  const ds=(S.d[0]||0)+(S.d[1]||0),plans=[];
  S.pl.forEach(id=>{
    const o=prev[id],n=S.mp[id];if(o==null||o===n)return;
    const fwd=(n-o+28)%28;
    if(rolled&&id===S.pl[S.t]||rolled){
      if(fwd===ds&&ds>0&&ds<=12)plans.push({id,path:Array.from({length:ds},(_,k)=>(o+k+1)%28)});
      else if(S.jl[id]==null&&ds>0&&ds<=12)plans.push({id,path:Array.from({length:ds},(_,k)=>(o+k+1)%28).concat([n])});
    }
  });
  if(!rolled&&!plans.length)return;
  const disp={...prev},delay=rolled?560:0,len=plans.reduce((a,p)=>Math.max(a,p.path.length),0);
  AN.lg={mp:disp};AN.busy=Date.now()+delay+len*125+200;
  if(rolled)diceTumble(paintLagDice,()=>{});
  paintLag();
  AN.lgs=setTimeout(()=>{
    let k=0;
    AN.lgt=setInterval(()=>{
      if(k<len){plans.forEach(p=>{if(k<p.path.length)disp[p.id]=p.path[k]});k++;snd('drop',k);paintLag()}
      else{clearInterval(AN.lgt);AN.lg=null;render()}
    },125);
  },delay);
}

/* ---- called on every new state ---- */
function animState(S){
  if(!S)return;
  const me=G.myId;
  if(AN.ar!==S.r){AN.ar=S.r;AN.ac=null;AN.endr=null}
  if(S.g==='ayo')ayoAnim(S);else if(S.g==='ludo')ludoAnim(S);else if(S.g==='lag')lagAnim(S);
  else if(S.g==='whot'){if(AN.wtop!==S.top){AN.wtop=S.top;AN.wtopAt=Date.now()}}
  /* your turn */
  const turnPh={whot:['play'],ludo:['roll','move'],lag:['roll','buy','after'],ayo:['play']}[S.g];
  if(turnPh&&turnPh.includes(S.ph)&&S.pl&&S.pl.includes(me)){
    const cur=S.pl[S.t];
    if(cur===me&&AN.ac!==me){snd('ding');buzz(35);toast('Your turn')}
    AN.ac=cur;
  }else if(S.ph!=='end')AN.ac=null;
  /* round over */
  if(S.ph==='end'&&S.g&&AN.endr!==S.r){
    AN.endr=S.r;
    const mineWin=S.wn===me||(S.wt||[]).includes(me);
    setTimeout(()=>{snd('win');buzz(mineWin?[60,40,60,40,120]:30);confetti(mineWin?70:34)},(AN.busy>Date.now()?AN.busy-Date.now():0)+150);
  }
  /* rebus: you solved it */
  if(S.g==='rebus'&&S.ph&&S.ok&&S.ok.includes(me)&&AN.rb!==S.r+':'+S.n){AN.rb=S.r+':'+S.n;snd('coin');buzz(30);confetti(26)}
}

function snap(){
  const o={v:{},f:null};
  document.querySelectorAll('[data-keep]').forEach(i=>{o.v[i.id]=i.value});
  const a=document.activeElement;
  if(a&&a.id&&a.hasAttribute('data-keep')){o.f=a.id;o.s=a.selectionStart;o.e=a.selectionEnd}
  return o;
}
function unsnap(o){
  for(const id in o.v){const i=document.getElementById(id);if(i&&i.value!==o.v[id])i.value=o.v[id]}
  if(o.f){const i=document.getElementById(o.f);if(i){i.focus();try{i.setSelectionRange(o.s,o.e)}catch(e){}}}
}

/* lagos landlords */
const lgK=n=>'₦'+n+'k';
function lgInfoCard(S,pos){
  const q=LSQ[pos],me=G.myId,o=S.ow[pos],cur=S.pl[S.t];
  const rows=[];
  const sw=q.g?el('span',{class:'lgsw',style:'background:'+LGC[q.g]}):null;
  if(q.k==='prop'){
    rows.push(['Price',lgK(q.p)],['Rent',lgK(q.r)],['Full colour set',lgK(q.r*2)]);
    for(let i=1;i<=3;i++)rows.push([i+(i>1?' floors':' floor'),lgK(q.r*LMUL[i])]);
    rows.push(['Build a floor',lgK(lgBuildCost(q))]);
  }else if(q.k==='stn')rows.push(['Price',lgK(q.p)],['Rent (1 / 2 / 3 terminals)','₦25k / 50k / 100k']);
  else if(q.k==='utl')rows.push(['Price',lgK(q.p)],['Rent (1 / 2 owned)','4x / 10x dice']);
  else if(q.k==='tax')rows.push(['Pay',lgK(q.p)]);
  else rows.push(['',{start:'Passing Start pays ₦150k.',jail:'Just visiting, or in jail.',park:'Nothing happens. Enjoy the beach.',gojail:'Go straight to jail.',chest:'Draw an Owambe card.',chance:'Draw a Lagos Luck card.'}[q.k]||'']);
  const lv=S.lv[pos]|0;
  const canBuild=q.k==='prop'&&o===me&&cur===me&&['roll','after'].includes(S.ph)&&lgMono(S,me,q.g)&&lv<3&&S.ca[me]>=lgBuildCost(q);
  return el('div',{class:'card'},el('div',{class:'lginfo'},
    el('h3',{},sw,q.n),
    o?el('span',{},'Owned by '+nameOf(o)+(o===me?' (you)':'')+(lv?', '+lv+(lv>1?' floors':' floor'):'')):((q.p&&q.k!=='tax')?el('span',{},'Unowned'):null),
    el('table',{},...rows.map(r=>el('tr',{},el('td',{},r[0]),el('td',{},r[1])))),
    canBuild?el('button',{class:'btn green',type:'button',on:{click:()=>act('mh',{q:pos})}},'Build a floor ('+lgK(lgBuildCost(q))+')'):null,
    q.k==='prop'&&o===me&&!lgMono(S,me,q.g)?el('small',{style:'color:var(--brown2)'},'Own every '+q.g+' area to build here.'):null));
}
function vLag(){

        el('ul',{class:'rows'},a.map(id=>el('li',{class:S.bk[id]?'bad':''},el('span',{class:'who'},el('span',{class:'ldot',style:'background:'+pc(id)}),avatar(id),el('span',{},nameOf(id))),el('b',{style:'color:var(--brown)'},S.bk[id]?'Bankrupt':'Worth '+lgK(lgWorth(S,id)))))),board()),

    if(S.ph==='after')btns.push(el('button',{class:'btn',type:'button',on:{click:()=>act('me')}},'End turn'));
  }
  const out=[el('div',{class:'card tabbed'},tab('Landlords','green'),brd,
    el('div',{class:'ldie'},
      el('div',{style:'display:flex;gap:6px;width:7.5rem;flex:none'},el('div',{id:'lgd0',style:'width:50%',html:ludoDie(AN.rolling?rnd6():S.d[0],'die'+(AN.rolling?' roll':''))}),el('div',{id:'lgd1',style:'width:50%',html:ludoDie(AN.rolling?rnd6():S.d[1],'die'+(AN.rolling?' roll':''))})),
